<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Oel Ngati Kameie — Glowing Flower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="ascii-canvas"></canvas>

      <div id="loading-overlay">
        <div class="loader-box">
          <div class="tutorial">
            <div class="tutorial-title">How to Navigate</div>
            <div class="tutorial-row"><span>1 Finger / Drag</span><span>Rotate</span></div>
            <div class="tutorial-row"><span>Pinch / Scroll</span><span>Zoom</span></div>
            <div class="tutorial-row"><span>2 Fingers / Right-Drag</span><span>Pan</span></div>
          </div>
          <div id="loader-spinner" class="loader-spinner"></div>
          <div id="loading-text">Loading...</div>
          <button id="btn-start" class="start-btn hidden">▶ Start</button>
        </div>
      </div>

      <audio id="bg-music" loop preload="auto" src="/avatar-theme.mp3"></audio>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
